name: Probe
options:
  bundleIdPrefix: com.hophacks
  deploymentTarget:
    iOS: "17.0"
targets:
  Probe:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - "*.xcodeproj"
      - path: ../models
        excludes:
          - "*.pt"
          - "*.ts"
          - yolo26n-seg-drinks.mlpackage
          - yoloe-26n-seg.mlpackage
          - .gitignore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hophacks.probe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera is used to detect hands and objects with AR."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
