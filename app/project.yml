name: Probe
options:
  bundleIdPrefix: com.hophacks
  deploymentTarget:
    iOS: "17.0"
targets:
  Probe:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - Info.plist
          - "*.xcodeproj"
          - build
          - archive
      - path: ../models
        excludes:
          - "*.pt"
          - "*.ts"
          - yolo26n-seg-drinks.mlpackage
          - yoloe-26n-seg.mlpackage
          - .gitignore
    # Written by XcodeGen (don't edit app/Info.plist; change it here and rerun `xcodegen`). It used to
    # be Xcode's own generated plist, driven by the `INFOPLIST_KEY_*` settings — but those only work for
    # keys on Xcode's own list, and `CADisableMinimumFrameDuration` isn't one: the setting landed in the
    # project and was then silently dropped from the built plist.
    info:
      path: Info.plist
      properties:
        # Without this, Core Animation caps the app at 60 fps on a ProMotion phone — and a frame missed
        # at 60 falls to the next divisor, 30, which is what the animations were dropping to. With it
        # the ceiling is the display's own 120, and a missed frame falls to 60 instead.
        CADisableMinimumFrameDuration: true
        NSCameraUsageDescription: "Camera is used to detect hands and objects with AR."
        NSMicrophoneUsageDescription: "Probe listens for your voice commands."
        NSSpeechRecognitionUsageDescription: "Probe uses speech recognition to understand your voice commands."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hophacks.probe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
