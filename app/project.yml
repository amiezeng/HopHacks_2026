name: Probe
options:
  bundleIdPrefix: com.hophacks
  deploymentTarget:
    iOS: "17.0"
targets:
  Probe:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - "*.xcodeproj"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hophacks.probe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera is used to detect hands and objects with AR."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Probe listens for your voice commands."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Probe uses speech recognition to understand your voice commands."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
